group = 'com.clevertap.clevertap_plugin'
version = '4.0.1'

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.6.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        flatDir {
            dirs 'libs'
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    buildFeatures {
        buildConfig = true
    }

    if (project.android.hasProperty("namespace")) {
        namespace = "com.clevertap.clevertap_plugin"
    }

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    dependencies {
        implementation 'androidx.core:core-ktx:1.9.0'
        testImplementation 'junit:junit:4.13.2'
        // Stage-modified CleverTap Android SDK — built from
        // github.com/vatsanatech/stage-clevertap-android (PRIMARY_DOMAIN = analytics.stage.in)
        api files('libs/clevertap-android-sdk-stage.aar')
        api 'org.jetbrains.kotlin:kotlin-stdlib:2.0.10'
        api 'androidx.appcompat:appcompat:1.7.0'
        api 'androidx.recyclerview:recyclerview:1.3.2'
        api 'androidx.lifecycle:lifecycle-process:2.9.4'
        api 'com.android.installreferrer:installreferrer:2.2'
        api 'androidx.work:work-runtime:2.10.2'
        compileOnly 'androidx.fragment:fragment:1.3.6'
        compileOnly 'androidx.core:core:1.9.0'
    }
}
